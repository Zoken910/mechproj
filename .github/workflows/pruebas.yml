# Pruebas automaticas (Paso 11.2): en cada push y pull request corre todos los testbenches de sim/
# y sintetiza el top del paso 9 y los bloques de la cadena con la version mas nueva de OSS CAD Suite.
# Si algo se rompe, GitHub lo marca en rojo antes de que llegue a la Pi de Levi.
# Lo mismo en la computadora: python tools/correr_pruebas.py --sintesis
name: pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simulacion-y-sintesis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: OSS CAD Suite (la version mas nueva)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Versiones
        run: |
          yosys -V
          iverilog -V 2>&1 | head -1

      - name: Testbenches y sintesis
        run: python3 tools/correr_pruebas.py --sintesis

      - name: Logs de las pruebas (si algo fallo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-pruebas
          path: build/pruebas/
